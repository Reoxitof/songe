<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Songe Tracker — Connexion</title>
  <link rel="stylesheet" href="style.css?v=25" />
  <style>
    .auth-wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
    .auth-card{width:100%;max-width:440px}
    .auth-logo{text-align:center;margin-bottom:2rem}
    .auth-logo .logo-icon{font-size:3rem;display:block;margin-bottom:.5rem;animation:pulse-gold 3s ease-in-out infinite}
    .auth-logo h1{font-size:1.7rem;background:linear-gradient(90deg,var(--gold),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.25rem}
    .auth-logo p{color:var(--text-muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.12em}
    .auth-tabs{display:flex;margin-bottom:1.5rem;border-bottom:1px solid var(--border);gap:.5rem}
    .auth-tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);cursor:pointer;font-size:.95rem;padding:.65rem;transition:all .2s;margin-bottom:-1px}
    .auth-tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:700}
    .auth-form{display:none}
    .auth-form.active{display:block}
    .auth-msg{font-size:.85rem;padding:.6rem .85rem;margin-bottom:1rem;border-radius:var(--radius-sm);display:none}
    .auth-msg.visible{display:block}
    .auth-msg.error{background:rgba(255,85,85,.1);border:1px solid var(--red-dim);color:var(--red)}
    .auth-msg.success{background:rgba(61,219,189,.1);border:1px solid var(--teal-dim);color:var(--teal)}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed}
    .pwd-wrap{position:relative;display:block;width:100%}
    .pwd-wrap input{width:100%;box-sizing:border-box;padding-right:2.8rem}
    .btn-eye{position:absolute;right:.65rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;line-height:1;padding:0}
    .btn-eye:hover{color:var(--text)}
    .strength-bar-wrap{height:3px;background:var(--border);border-radius:999px;margin-top:.35rem;overflow:hidden}
    .strength-bar{height:100%;border-radius:999px;transition:width .3s,background .3s;width:0}
    .strength-lbl{font-size:.7rem;color:var(--text-muted);margin-top:.2rem}
    .auth-footer{text-align:center;margin-top:1.5rem;color:var(--text-dim);font-size:.75rem}
  </style>
</head>
<body>
<div class="auth-wrapper">
  <div class="card auth-card">
    <div class="auth-logo">
      <span class="logo-icon">✦</span>
      <h1>Songe Tracker</h1>
      <p>Dofus — Suivi de drops &amp; forgemagie</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-form="login">Connexion</button>
      <button class="auth-tab"        data-form="register">Inscription</button>
    </div>

    <!-- LOGIN -->
    <form id="form-login" class="auth-form active" novalidate>
      <div class="auth-msg error"   id="login-err"></div>
      <div class="auth-msg success" id="login-ok"></div>
      <div class="form-group">
        <label for="l-user">Nom d'utilisateur</label>
        <input type="text" id="l-user" autocomplete="username" placeholder="Votre pseudo" maxlength="30" required />
      </div>
      <div class="form-group">
        <label for="l-pwd">Mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" id="l-pwd" autocomplete="current-password" placeholder="••••••••" maxlength="128" required />
          <button type="button" class="btn-eye" data-t="l-pwd">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="btn-login">✦ Se connecter</button>
    </form>

    <!-- REGISTER -->
    <form id="form-register" class="auth-form" novalidate>
      <div class="auth-msg error"   id="reg-err"></div>
      <div class="auth-msg success" id="reg-ok"></div>
      <div class="form-group">
        <label for="r-user">Nom d'utilisateur</label>
        <input type="text" id="r-user" autocomplete="username" placeholder="3-30 car., lettres/chiffres/- _" maxlength="30" required />
      </div>
      <div class="form-group">
        <label for="r-pwd">Mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" id="r-pwd" autocomplete="new-password" placeholder="Minimum 8 caractères" maxlength="128" required />
          <button type="button" class="btn-eye" data-t="r-pwd">👁</button>
        </div>
        <div class="strength-bar-wrap"><div class="strength-bar" id="s-bar"></div></div>
        <div class="strength-lbl" id="s-lbl"></div>
      </div>
      <div class="form-group">
        <label for="r-pwd2">Confirmer le mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" id="r-pwd2" autocomplete="new-password" placeholder="Retapez le mot de passe" maxlength="128" required />
          <button type="button" class="btn-eye" data-t="r-pwd2">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="btn-register">✦ Créer un compte</button>
    </form>

    <p class="auth-footer">Données sécurisées sur le serveur</p>
  </div>
</div>

<script>
'use strict';
// Redirection si déjà connecté
(function(){
  const t = localStorage.getItem('st_token');
  if (!t) return;
  fetch('/api/auth/me',{headers:{'Authorization':'Bearer '+t}})
    .then(r=>{ if(r.ok) r.json().then(d=>{ window.location.replace('/app.html'); }); })
    .catch(()=>{});
})();

// Tabs
document.querySelectorAll('.auth-tab').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f=>f.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('form-'+b.dataset.form).classList.add('active');
  });
});

// Toggle password visibility
document.querySelectorAll('.btn-eye').forEach(b=>{
  b.addEventListener('click',()=>{
    const inp=document.getElementById(b.dataset.t);
    inp.type=inp.type==='password'?'text':'password';
    b.textContent=inp.type==='password'?'👁':'🙈';
  });
});

// Jauge force mot de passe
document.getElementById('r-pwd').addEventListener('input',function(){
  const p=this.value, bar=document.getElementById('s-bar'), lbl=document.getElementById('s-lbl');
  let s=0;
  if(p.length>=8)s++; if(p.length>=12)s++;
  if(/[A-Z]/.test(p))s++; if(/[0-9]/.test(p))s++; if(/[^A-Za-z0-9]/.test(p))s++;
  const lvls=[
    {w:'0%',bg:'transparent',t:''},
    {w:'20%',bg:'#ff5555',t:'Très faible'},
    {w:'40%',bg:'#ff9955',t:'Faible'},
    {w:'65%',bg:'#f0c040',t:'Moyen'},
    {w:'85%',bg:'#3ddbbd',t:'Fort'},
    {w:'100%',bg:'#4db8ff',t:'Très fort'},
  ];
  const l=p.length===0?lvls[0]:lvls[Math.min(s,5)];
  bar.style.width=l.w; bar.style.background=l.bg; lbl.textContent=l.t;
});

function showMsg(id,msg,type){
  const el=document.getElementById(id);
  el.textContent=msg; el.className='auth-msg '+type+' visible';
}
function hideMsg(id){ document.getElementById(id).classList.remove('visible'); }
function setBtn(id,loading,defaultTxt){
  const b=document.getElementById(id);
  b.disabled=loading; b.textContent=loading?'⏳ Chargement...':defaultTxt;
}

// Login
document.getElementById('form-login').addEventListener('submit',async e=>{
  e.preventDefault();
  hideMsg('login-err'); hideMsg('login-ok');
  const username=document.getElementById('l-user').value.trim();
  const password=document.getElementById('l-pwd').value;
  if(!username||!password){showMsg('login-err','Remplis tous les champs.','error');return;}
  setBtn('btn-login',true,'✦ Se connecter');
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const d=await r.json();
    if(!r.ok){showMsg('login-err',d.error||'Erreur serveur.','error');return;}
    localStorage.setItem('st_token',d.token);
    localStorage.setItem('st_username',d.username);
    localStorage.setItem('st_admin',d.isAdmin?'1':'0');
    showMsg('login-ok','✓ Connexion réussie...','success');
    setTimeout(()=>window.location.replace('/app.html'),500);
  }catch{showMsg('login-err','Erreur réseau.','error');}
  finally{setBtn('btn-login',false,'✦ Se connecter');}
});

// Register
document.getElementById('form-register').addEventListener('submit',async e=>{
  e.preventDefault();
  hideMsg('reg-err'); hideMsg('reg-ok');
  const username=document.getElementById('r-user').value.trim();
  const password=document.getElementById('r-pwd').value;
  const password2=document.getElementById('r-pwd2').value;
  if(!username||!password||!password2){showMsg('reg-err','Remplis tous les champs.','error');return;}
  if(password!==password2){showMsg('reg-err','Les mots de passe ne correspondent pas.','error');return;}
  setBtn('btn-register',true,'✦ Créer un compte');
  try{
    const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const d=await r.json();
    if(!r.ok){showMsg('reg-err',d.error||'Erreur serveur.','error');return;}
    localStorage.setItem('st_token',d.token);
    localStorage.setItem('st_username',d.username);
    localStorage.setItem('st_admin','0');
    showMsg('reg-ok','✓ Compte créé, redirection...','success');
    setTimeout(()=>window.location.replace('/app.html'),500);
  }catch{showMsg('reg-err','Erreur réseau.','error');}
  finally{setBtn('btn-register',false,'✦ Créer un compte');}
});
</script>
</body>
</html>
